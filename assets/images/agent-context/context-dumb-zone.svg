<svg xmlns="http://www.w3.org/2000/svg" width="800" height="260" viewBox="0 0 800 260" role="img" aria-labelledby="title desc">
  <title id="title">Context window with a dumb zone</title>
  <desc id="desc">A diagram showing a context window split into a smart zone, where the model stays reliable, and a dumb zone, where quality degrades.</desc>
  <defs>
    <linearGradient id="smart" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#2b8c7f"/>
      <stop offset="100%" stop-color="#67b58e"/>
    </linearGradient>
    <linearGradient id="dumb" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#f6b34d"/>
      <stop offset="100%" stop-color="#df7049"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-30%" width="120%" height="170%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#18202a" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="800" height="260" rx="18" fill="#f8faf8"/>
  <text x="60" y="56" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="25" font-weight="700" fill="#18202a">Smart zone vs dumb zone</text>
  <text x="60" y="84" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#586271">A larger window gives more room, but not all of it is equally useful.</text>

  <g filter="url(#shadow)">
    <rect x="60" y="120" width="680" height="84" rx="17" fill="#ffffff"/>
    <rect x="72" y="132" width="378" height="60" rx="12" fill="url(#smart)"/>
    <rect x="450" y="132" width="278" height="60" rx="12" fill="url(#dumb)"/>
  </g>

  <text x="261" y="167" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#ffffff">smart zone</text>
  <text x="589" y="167" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#ffffff">dumb zone</text>

  <text x="60" y="232" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#586271">Schematic only: the boundary moves with model, task, prompt, and trajectory noise.</text>
</svg>
