<svg xmlns="http://www.w3.org/2000/svg" width="800" height="380" viewBox="0 0 800 380" role="img" aria-labelledby="title desc">
  <title id="title">Context window with a dumb zone</title>
  <desc id="desc">A diagram showing that the useful context window can be smaller than the advertised maximum context window, with a shaded dumb zone where quality can degrade.</desc>
  <defs>
    <linearGradient id="smart" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#2b8c7f"/>
      <stop offset="100%" stop-color="#67b58e"/>
    </linearGradient>
    <linearGradient id="dumb" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#f6b34d"/>
      <stop offset="100%" stop-color="#df7049"/>
    </linearGradient>
    <linearGradient id="limit" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#b84d5b"/>
      <stop offset="100%" stop-color="#75344a"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-30%" width="120%" height="170%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#18202a" flood-opacity="0.16"/>
    </filter>
    <pattern id="stripes" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="12" stroke="#ffffff" stroke-width="4" stroke-opacity="0.25"/>
    </pattern>
  </defs>

  <rect width="800" height="380" rx="18" fill="#f8faf8"/>
  <text x="60" y="56" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="25" font-weight="700" fill="#18202a">Advertised context window vs useful context</text>
  <text x="60" y="84" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#586271">A larger window gives more room, but not all positions are equally useful.</text>

  <g filter="url(#shadow)">
    <rect x="60" y="132" width="680" height="84" rx="17" fill="#ffffff"/>
    <rect x="72" y="144" width="272" height="60" rx="12" fill="url(#smart)"/>
    <rect x="344" y="144" width="178" height="60" fill="url(#dumb)"/>
    <rect x="344" y="144" width="178" height="60" fill="url(#stripes)"/>
    <rect x="522" y="144" width="206" height="60" rx="12" fill="url(#limit)"/>
    <rect x="522" y="144" width="12" height="60" fill="url(#limit)"/>
  </g>

  <text x="208" y="170" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#ffffff">useful / smart zone</text>
  <text x="208" y="191" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#e9fff7">high-signal working context</text>

  <text x="433" y="170" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="19" font-weight="800" fill="#ffffff">dumb zone</text>
  <text x="433" y="191" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#fff4df">quality starts to drift</text>

  <text x="625" y="170" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#ffffff">near hard limit</text>
  <text x="625" y="191" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#ffe8ec">compact soon</text>

  <line x1="72" y1="242" x2="728" y2="242" stroke="#c8d0d8" stroke-width="2"/>
  <line x1="72" y1="232" x2="72" y2="252" stroke="#8b96a3" stroke-width="2"/>
  <line x1="344" y1="232" x2="344" y2="252" stroke="#8b96a3" stroke-width="2"/>
  <line x1="522" y1="232" x2="522" y2="252" stroke="#8b96a3" stroke-width="2"/>
  <line x1="728" y1="232" x2="728" y2="252" stroke="#8b96a3" stroke-width="2"/>

  <text x="72" y="278" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#586271">0%</text>
  <text x="344" y="278" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#586271">roughly 40%</text>
  <text x="522" y="278" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#586271">roughly 60%</text>
  <text x="728" y="278" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#586271">maximum</text>

  <path d="M72 315 C170 296, 280 296, 344 315 S457 346, 522 315 S642 288, 728 315" fill="none" stroke="#364659" stroke-width="3"/>
  <circle cx="240" cy="300" r="5" fill="#2b8c7f"/>
  <circle cx="433" cy="334" r="5" fill="#df7049"/>
  <circle cx="654" cy="299" r="5" fill="#75344a"/>
  <text x="60" y="354" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#586271">Schematic only: the boundary moves with model, task, prompt, and trajectory noise.</text>
</svg>
